version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=cohere/north-mini-code:free
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPOSITORY_OWNER=dj-DeepakJadhav
      - GITHUB_REPOSITORY_NAME=DataGuardian-Agent-Demo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
